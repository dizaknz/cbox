# ── Default simulation scenario ───────────────────────────────────
# Launches N simulated camera devices with realistic event patterns.
# Each device runs its own eventd process with isolated directory trees.
# Sensord is simulated via SimEventSource (no separate process needed).

base_dir: "./sim-out"
max_devices: 10

devices:
  - device_id: "a1b2c3d4e5f60001a1b2c3d4e5f60001"
    tenant_id: "tenant-0000000000000001"
    rate_per_hour: 20
    burst_factor: 1.5
    jitter_ms: 500
    cooldown_s: 30
    sensor_id: 1
    use_sim_event_source: true   # Use SimEventSource instead of sensord process

  - device_id: "a1b2c3d4e5f60002a1b2c3d4e5f60002"
    tenant_id: "tenant-0000000000000001"
    rate_per_hour: 8
    burst_factor: 2.0
    jitter_ms: 300
    cooldown_s: 45
    sensor_id: 1
    use_sim_event_source: true

  - device_id: "a1b2c3d4e5f60003a1b2c3d4e5f60003"
    tenant_id: "tenant-0000000000000002"
    rate_per_hour: 5
    burst_factor: 1.0
    jitter_ms: 200
    cooldown_s: 60
    sensor_id: 2
    use_sim_event_source: true
